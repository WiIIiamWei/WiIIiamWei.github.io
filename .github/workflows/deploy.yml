name: Deploy to Github Pages

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            # Give the default GITHUB_TOKEN write permission to commit and push the
            # added or changed files to the repository.
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Cache Hugo resources
              uses: actions/cache@v4
              env:
                  cache-name: cache-hugo-resources
              with:
                  path: resources
                  key: ${{ env.cache-name }}

            - uses: actions/setup-go@v5
              with:
                  go-version: "^1.17.0"
            - run: go version

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v2
              with:
                  hugo-version: "0.169.0"
                  extended: true

            - name: Install Dart Sass
              env:
                  SASS_VERSION: 1.107.1
              run: |
                  curl -fsSL --retry 3 "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz" -o "${RUNNER_TEMP}/dart-sass.tar.gz"
                  echo "6cefe78692d03ca53843394bb98de4dccf9a3d8ee5ece40be7316be852624003  ${RUNNER_TEMP}/dart-sass.tar.gz" | sha256sum -c -
                  tar -xzf "${RUNNER_TEMP}/dart-sass.tar.gz" -C "${RUNNER_TEMP}"
                  echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"

            - name: Build
              run: hugo --minify --gc --panicOnWarning

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: pages
                  folder: public
                  clean: true
                  single-commit: true

            - name: Checkout pages
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              uses: actions/checkout@v4
              with:
                  ref: pages
                  fetch-depth: 0

            - name: Mirror to Codeberg
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              uses: yesolutions/mirror-action@v0.7.0
              with:
                  REMOTE: git@codeberg.org:WilliamWei/blog.git
                  GIT_SSH_PRIVATE_KEY: ${{ secrets.CODEBERG_SSH_PRIVATE_KEY }}
                  GIT_SSH_NO_VERIFY_HOST: "true"
